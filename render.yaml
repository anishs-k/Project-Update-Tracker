services:
  - type: web
    name: ctw-task-checklist
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ctw-task-checklist-db
          property: connectionString

databases:
  - name: ctw-task-checklist-db
    plan: free
