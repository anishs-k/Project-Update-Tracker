services:
  - type: web
    name: ctw-task-checklist
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: NODE_ENV
        value: production
      # MongoDB Atlas connection string. Secret: set its value in the Render
      # dashboard (Render prompts for it when the Blueprint is created).
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: ctw_tracker
